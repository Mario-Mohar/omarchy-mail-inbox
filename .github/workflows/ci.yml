name: CI

# Runs on every push and every pull request, forks included. It asks for
# nothing but read access on purpose: a fork's token is read-only anyway, and a
# workflow that executes contributed code has no business holding a write one.
# Posting the result is a separate workflow, pr-report.yml, which runs from the
# default branch and never executes any of the code under test.

on:
  # Only the default branch on push. A branch with an open pull request would
  # otherwise be checked twice for every commit -- once as a push and once as a
  # pull request -- which doubles the minutes and puts two identically named
  # status checks on the same commit.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install check tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck qt6-declarative-dev-tools

      - name: Manifest and textFormat
        id: plugin
        continue-on-error: true
        run: python3 .github/scripts/check_plugin.py

      - name: QML syntax
        id: qml
        continue-on-error: true
        run: |
          # qmllint exits 0 even on a syntax error and reports it as a warning
          # tagged [syntax]. Everything else it says here is an unresolved
          # Quickshell import, which cannot be resolved outside a real shell.
          find . -name '*.qml' -not -path './.git/*' -print0 \
            | xargs -0 -r /usr/lib/qt6/bin/qmllint > qmllint.log 2>&1 || true
          if grep -q '\[syntax\]' qmllint.log; then
            echo "QML syntax errors:"
            grep '\[syntax\]' qmllint.log
            exit 1
          fi
          echo "no QML syntax errors"

      - name: Shell scripts
        id: shell
        continue-on-error: true
        run: |
          mapfile -t scripts < <(git ls-files | while read -r f; do
            [ -f "$f" ] && head -1 "$f" | grep -qE '^#!.*\b(bash|sh)$' && echo "$f"
          done)
          if [ ${#scripts[@]} -eq 0 ]; then echo "no shell scripts"; exit 0; fi
          printf 'checking %s\n' "${scripts[@]}"
          shellcheck -e SC2164 "${scripts[@]}"

      - name: Python lint
        id: lint
        continue-on-error: true
        run: ruff check .

      - name: Tests
        id: tests
        continue-on-error: true
        run: pytest tests/ -v --junit-xml=pytest.xml --cov=bin --cov-report=term --cov-report=xml

      # Codecov keeps the history behind the number and feeds the badge in the
      # README. It never gates: a bad day at Codecov is no reason to fail a pull
      # request, and a fork or a Dependabot branch has no secrets to offer
      # anyway. The repository is public, so the upload needs no token.
      - name: Coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Build report
        id: report
        if: always()
        env:
          PLUGIN: ${{ steps.plugin.outcome }}
          QML: ${{ steps.qml.outcome }}
          SHELLCHECK: ${{ steps.shell.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          mark() { if [ "$1" = success ]; then echo "✅"; else echo "❌"; fi; }
          tests_line="$(python3 .github/scripts/junit_summary.py pytest.xml)"

          mkdir -p pr-report
          {
            echo "| Check | | Detail |"
            echo "| --- | :-: | --- |"
            echo "| Manifest and textFormat | $(mark "$PLUGIN") | manifest.json schema, every Text declares a format |"
            echo "| QML syntax | $(mark "$QML") | qmllint, syntax diagnostics only |"
            echo "| Shell scripts | $(mark "$SHELLCHECK") | shellcheck |"
            echo "| Python lint | $(mark "$LINT") | ruff |"
            echo "| Tests | $(mark "$TESTS") | ${tests_line} |"
          } > pr-report/report.md

          overall=success
          for outcome in "$PLUGIN" "$QML" "$SHELLCHECK" "$LINT" "$TESTS"; do
            [ "$outcome" = success ] || overall=failure
          done
          echo "$overall" > pr-report/status.txt
          echo "overall=$overall" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "${{ github.event.pull_request.number }}" > pr-report/pr-number.txt
          fi

          cat pr-report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-report
          path: pr-report/
          retention-days: 3

      - name: Fail if a check failed
        if: always() && steps.report.outputs.overall != 'success'
        run: |
          echo "One or more checks failed; the table is in the job summary."
          exit 1
